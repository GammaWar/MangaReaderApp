name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: |
            android-app/gradle/libs.versions.toml
            android-app/**/*.gradle.kts

      - name: Grant execute permission for Gradle wrapper
        working-directory: android-app
        run: chmod +x gradlew

      - name: Run Unit Tests & Build Debug APK
        working-directory: android-app
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaReaderApp-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 14
